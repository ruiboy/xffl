type Mutation
  @join__type(graph: AFL)
  @join__type(graph: FFL)
{
  """Add an AFL player to a club's season squad."""
  addAFLPlayer(input: AddAFLPlayerInput!): AFLPlayerSeason! @join__field(graph: AFL)

  """Add an additional season record for an existing AFL player."""
  addAFLPlayerSeason(input: AddAFLPlayerSeasonInput!): AFLPlayerSeason! @join__field(graph: AFL)

  """Update stats for an AFL player match."""
  updateAFLPlayerMatch(input: UpdateAFLPlayerMatchInput!): AFLPlayerMatch! @join__field(graph: AFL)

  """
  Import player stats for a match from the external source. Returns a result including any unmatched players.
  """
  importAFLMatchStats(matchId: ID!): ImportAFLMatchStatsResult! @join__field(graph: AFL)

  """
  Manually link an unmatched player from a stats import to a player season.
  """
  resolveAFLPlayerMatch(input: ResolveAFLPlayerMatchInput!): AFLPlayerMatch! @join__field(graph: AFL)

  """Mark a match's stats as complete (final) or revert to partial."""
  markAFLMatchStatsComplete(matchId: ID!, complete: Boolean!): AFLMatch! @join__field(graph: AFL)

  """
  Rebuild AFL ladder standings for the given season from all final matches.
  """
  recalculateAFLLadder(seasonId: ID!): Boolean! @join__field(graph: AFL)

  """Add an AFL player to an FFL club's season squad."""
  addFFLPlayerToSeason(input: AddFFLPlayerToSeasonInput!): FFLPlayerSeason! @join__field(graph: FFL)

  """Remove a player from an FFL club's season squad."""
  removeFFLPlayerFromSeason(input: RemoveFFLPlayerFromSeasonInput!): Boolean! @join__field(graph: FFL)

  """Update notes for a player season."""
  updateFFLPlayerSeason(input: UpdateFFLPlayerSeasonInput!): FFLPlayerSeason! @join__field(graph: FFL)

  """
  Calculate and store the fantasy score for a player match from AFL stats.
  """
  calculateFFLFantasyScore(input: CalculateFFLFantasyScoreInput!): FFLPlayerMatch! @join__field(graph: FFL)

  """
  Set the complete team selection for a club match.
  Errors:
    BYE_INELIGIBLE — extensions.playerSeasonId identifies the ineligible player.
  """
  setFFLTeam(input: SetFFLTeamInput!): [FFLPlayerMatch!]! @join__field(graph: FFL)

  """
  Rebuild FFL ladder standings for the given season from all final matches.
  """
  recalculateFFLLadder(seasonId: ID!): Boolean! @join__field(graph: FFL)

  """
  Re-apply AFL stats to all linked player_matches for a club_match and re-sum the total. Returns the new club match score.
  """
  recalculateFFLClubMatchScore(clubMatchId: ID!): Int! @join__field(graph: FFL)

  """
  Record Team Manager substitution and interchange decisions for a club match.
  """
  declareFFLSubstitutions(input: DeclareFFLSubstitutionsInput!): [FFLPlayerMatch!]! @join__field(graph: FFL)

  """
  Move a player match up or down within its position group, adjusting display order.
  """
  reorderFFLPlayerMatch(id: ID!, direction: FFLReorderDirection!): [FFLPlayerMatch!]! @join__field(graph: FFL)

  """
  Parse a forum post and resolve players against the squad. Returns a result for review — no DB writes.
  """
  parseFFLTeamSubmission(input: ParseFFLTeamSubmissionInput!): ParseFFLTeamSubmissionResult! @join__field(graph: FFL)

  """
  Confirm a reviewed parse result and write player matches to the database.
  """
  confirmFFLTeamSubmission(input: ConfirmFFLTeamSubmissionInput!): [FFLPlayerMatch!]! @join__field(graph: FFL)

  """Lock a FFL club_match as final — triggers the FFL scoring chain."""
  markFFLTeamFinal(input: MarkFFLTeamFinalInput!): Boolean! @join__field(graph: FFL)

  """
  Revert a FFL club_match from final back to submitted, allowing further edits.
  """
  markFFLTeamSubmitted(input: MarkFFLTeamFinalInput!): Boolean! @join__field(graph: FFL)

  """
  Ingest a captured forum page (from the capture userscript). Parses each post in-session for preview — no DB writes.
  """
  ingestFFLForumPage(input: IngestFFLForumPageInput!): FFLPreviewedPage! @join__field(graph: FFL)

  """Clear the in-session forum capture buffer."""
  clearFFLForumCaptures: Boolean! @join__field(graph: FFL)

  """Create an FFL season (name + rules era + clubs)."""
  buildFFLSeason(input: BuildFFLSeasonInput!): FFLBuiltSeason! @join__field(graph: FFL)

  """
  Save (create / edit / delete) a season's rounds and fixtures. Reconciled atomically; rounds with submitted teams are immutable.
  """
  saveFFLFixtures(input: SaveFFLFixturesInput!): Boolean! @join__field(graph: FFL)

  """
  Parse a squads thread against an AFL season's players. Returns resolved squads for review — no DB writes.
  """
  parseFFLSquadThread(input: ParseFFLSquadThreadInput!): ParseFFLSquadThreadResult! @join__field(graph: FFL)

  """
  Confirm one club's reviewed squad and add its members to the club_season squad. Members without a resolved AFL player_season are skipped.
  """
  importFFLSquad(input: ImportFFLSquadInput!): [FFLPlayerSeason!]! @join__field(graph: FFL)

  """
  Parse a pasted season fixture sheet into rounds + fixtures with reference scores. No DB writes.
  """
  parseFFLFixtureSheet(input: ParseFFLFixtureSheetInput!): ParseFFLFixtureSheetResult! @join__field(graph: FFL)

  """
  Confirm reviewed fixture rounds: build the season's rounds/fixtures (inferring byes) and record spreadsheet reference scores. Refuses the whole import if any club name is unresolved.
  """
  importFFLFixtures(input: ImportFFLFixturesInput!): ImportFFLFixturesResult! @join__field(graph: FFL)
}

