syntax = "proto3";

package afl.v1;

option go_package = "xffl/contracts/gen/afl/v1;aflv1";

service PlayerLookup {
  rpc LookupPlayers(LookupPlayersRequest) returns (LookupPlayersResponse);
  rpc LookupPlayerSeason(LookupPlayerSeasonRequest) returns (LookupPlayerSeasonResponse);
  rpc LookupPlayerMatch(LookupPlayerMatchRequest) returns (LookupPlayerMatchResponse);
  rpc LookupByeInfo(LookupByeInfoRequest) returns (LookupByeInfoResponse);
  // LookupPlayerSeasonsBySeasonID returns every player_season in an AFL season with
  // its name and club, for building a candidate pool to fuzzy-match imported names
  // against (e.g. the FFL squad importer).
  rpc LookupPlayerSeasonsBySeasonID(LookupPlayerSeasonsBySeasonIDRequest) returns (LookupPlayerSeasonsBySeasonIDResponse);
  // LookupFinalStatusBySeasonRound returns "played"/"dnp" for each player_season_id
  // whose club's match in the round is already final. Player_season_ids whose club's
  // match isn't final yet are omitted from the response.
  rpc LookupFinalStatusBySeasonRound(LookupBySeasonRound) returns (LookupFinalStatusResponse);
}

message LookupPlayersRequest {
  repeated int32 afl_player_ids = 1;
}

message LookupPlayersResponse {
  repeated PlayerInfo players = 1;
}

message PlayerInfo {
  int32 id         = 1;
  string name      = 2;
  string club_name = 3;
}

message LookupPlayerSeasonRequest {
  int32 player_season_id = 1;
}

message LookupPlayerSeasonResponse {
  int32 player_id = 1;
}

message LookupPlayerMatchRequest {
  oneof key {
    LookupByIDs          by_ids          = 1;
    LookupBySeasonRound  by_season_round = 2;
  }
}

message LookupByIDs {
  repeated int32 ids = 1;
}

message LookupBySeasonRound {
  repeated int32 player_season_ids = 1;
  int32          round_id          = 2;
}

message LookupPlayerMatchResponse {
  repeated PlayerMatchStats stats = 1;
}

message PlayerMatchStats {
  int32  id               = 1;
  string status           = 2;
  int32  goals            = 3;
  int32  kicks            = 4;
  int32  handballs        = 5;
  int32  marks            = 6;
  int32  tackles          = 7;
  int32  hitouts          = 8;
  int32  player_season_id = 9;
}

message LookupByeInfoRequest {
  repeated int32 player_season_ids = 1;
  int32          round_id          = 2;
}

message ByePlayerInfo {
  int32  player_season_id = 1;
  bool   has_bye          = 2;
  bool   played_last      = 3;
  double avg_goals        = 4;
  double avg_kicks        = 5;
  double avg_handballs    = 6;
  double avg_marks        = 7;
  double avg_tackles      = 8;
  double avg_hitouts      = 9;
}

message LookupByeInfoResponse {
  repeated ByePlayerInfo players = 1;
}

message LookupPlayerSeasonsBySeasonIDRequest {
  int32 afl_season_id = 1;
}

message LookupPlayerSeasonsBySeasonIDResponse {
  repeated PlayerSeasonWithClub players = 1;
}

message PlayerSeasonWithClub {
  int32  player_season_id = 1;
  int32  player_id        = 2;
  string name             = 3;
  string club_name        = 4;
}

message LookupFinalStatusResponse {
  repeated FinalPlayerStatus players = 1;
}

message FinalPlayerStatus {
  int32  player_season_id = 1;
  string status            = 2; // "played" or "dnp"
}
